<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMI Lunch & Dinner Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbar for elegant look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-[#f8fafc] font-sans text-slate-800 antialiased" id="app-root">

    <nav class="bg-slate-900 text-white shadow-md sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-utensils text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tight text-white">CMI FOOD PORTAL</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Office Management System</p>
            </div>
        </div>
        
        <div class="bg-slate-800 p-1 rounded-xl flex gap-1 border border-slate-700/50">
            <button onclick="switchView('staff')" id="tab-staff" class="px-4 py-1.5 rounded-lg text-xs font-bold tracking-wide transition-all cursor-pointer bg-orange-500 text-white shadow-xs">
                <i class="fa-solid fa-users mr-1"></i> Staff View
            </button>
            <button onclick="switchView('admin')" id="tab-admin" class="px-4 py-1.5 rounded-lg text-xs font-bold tracking-wide transition-all cursor-pointer text-slate-400 hover:text-white">
                <i class="fa-solid fa-user-shield mr-1"></i> Admin Panel
            </button>
        </div>
    </nav>

    <main class="min-h-[calc(100vh-65px)]">

        <div id="view-staff" class="flex flex-col lg:flex-row dynamic-view">
            <div class="flex-1 p-4 md:p-6 max-w-6xl mx-auto w-full">
                <header class="mb-6 flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-100 pb-4">
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">Today's Active Menu</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Select your meal and confirm your booking instantly.</p>
                    </div>
                    <div class="self-start bg-emerald-50 border border-emerald-100 text-emerald-700 text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-xs">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> SYSTEM ONLINE (24/7)
                    </div>
                </header>

                <div class="relative w-full mb-6">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="staff-search" oninput="renderStaffGrid()" placeholder="Search dishes, drinks or snacks..." class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-200 bg-white shadow-xs text-sm focus:outline-hidden focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all">
                </div>

                <div id="staff-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                    </div>
            </div>

            <div class="w-full lg:w-80 bg-white border-t lg:border-t-0 lg:border-l border-slate-100 p-5 flex flex-col lg:h-[calc(100vh-65px)] lg:sticky lg:top-[65px] shadow-xs">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-50">
                    <h3 class="font-bold text-slate-900 text-sm uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-basket-shopping text-orange-500"></i> Current Booking
                    </h3>
                    <button onclick="clearCart()" class="text-slate-400 hover:text-red-500 text-xs font-semibold transition-all cursor-pointer">Clear All</button>
                </div>

                <div id="basket-container" class="flex-1 overflow-y-auto space-y-2.5 my-2 min-h-[120px]">
                    <div id="basket-empty" class="flex flex-col items-center justify-center py-12 text-center">
                        <i class="fa-solid fa-clipboard-list text-slate-200 text-4xl mb-2"></i>
                        <p class="text-slate-400 text-xs font-medium">Your basket is empty</p>
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-4 mt-auto">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Payable</span>
                        <span class="text-xl font-black text-slate-900 flex items-baseline gap-0.5">
                            <span class="text-xs font-bold text-slate-400">Rs.</span>
                            <span id="basket-total">0</span>
                        </span>
                    </div>
                    <button onclick="submitOrder()" class="w-full bg-slate-900 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all text-xs uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-regular fa-circle-check text-sm"></i> Confirm Order
                    </button>
                </div>
            </div>
        </div>


        <div id="view-admin" class="p-4 md:p-6 max-w-7xl mx-auto w-full hidden dynamic-view">
            <header class="mb-6 pb-4 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">Management Dashboard</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Add products, check live sales metrics, and monitor incoming logs.</p>
                </div>
                <button onclick="openAddModal()" class="bg-orange-500 hover:bg-orange-600 text-white

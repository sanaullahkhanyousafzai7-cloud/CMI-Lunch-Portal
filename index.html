<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMI Office Lunch - Staff Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <div class="min-h-screen flex flex-col md:flex-row">
        
        <div class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
            <header class="mb-8 border-b border-gray-200 pb-4 flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-extrabold text-blue-900 tracking-tight">CMI Office Lunch</h1>
                    <p class="text-gray-500 text-sm mt-1">Self-Service Lunch Ordering</p>
                </div>
                <div class="bg-green-100 text-green-800 text-xs px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> 24/7 ORDERING OPEN
                </div>
            </header>

            <div class="mb-6">
                <div class="relative w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" id="search-bar" placeholder="Search lunch items or categories..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300 bg-white focus:outline-hidden focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                </div>
            </div>

            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </div>

        <div class="w-full md:w-96 bg-white border-t md:border-t-0 md:border-l border-gray-200 p-6 flex flex-col md:h-screen md:sticky md:top-0 shadow-xl">
            <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-basket-shopping text-blue-600"></i> New Booking
            </h2>
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-4 pr-1 my-2 min-h-[150px]">
                <p id="empty-cart-msg" class="text-gray-400 text-center py-8 text-sm">Booking cart is empty</p>
            </div>
            <div class="border-t border-gray-100 pt-4 mt-auto">
                <div class="flex justify-between font-bold text-lg text-gray-900 mb-4">
                    <span>Total Cost</span>
                    <span id="cart-total">Rs. 0</span>
                </div>
                <button id="place-order-btn" onclick="placeOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all">
                    Confirm Order
                </button>
            </div>
        </div>

    </div>

    <script type="module">
        // ASLI MENU ITEMS WITH IMAGES
        const products = [
            { id: "1", name: "Shami Kabab", price: 150, category: "CMI", img: "https://images.unsplash.com/photo-1606491956689-2ea866880c84?w=500&auto=format&fit=crop&q=60" },
            { id: "2", name: "Anda Cheese", price: 130, category: "CMI", img: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=500&auto=format&fit=crop&q=60" },
            { id: "3", name: "French Fries", price: 100, category: "CMI", img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500&auto=format&fit=crop&q=60" },
            { id: "4", name: "Cheese Paratha", price: 180, category: "CMI", img: "https://images.unsplash.com/photo-1626132647523-66f5bf380027?w=500&auto=format&fit=crop&q=60" },
            { id: "5", name: "Prince Biscuit", price: 30, category: "CMI", img: "https://images.unsplash.com/photo-1558961312-50346c099887?w=500&auto=format&fit=crop&q=60" },
            { id: "6", name: "Dal Chawal", price: 150, category: "CMI", img: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=500&auto=format&fit=crop&q=60" },
            { id: "7", name: "White Naan", price: 30, category: "CMI", img: "https://images.unsplash.com/photo-1601050690597-df056fb4ce78?w=500&auto=format&fit=crop&q=60" },
            { id: "8", name: "Dhei", price: 50, category: "CMI", img: "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = [];

        window.addEventListener('DOMContentLoaded', () => {
            renderGrid();
        });

        function renderGrid(filterText = '') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            const filtered = products.filter(p => p.name.toLowerCase().includes(filterText.toLowerCase()));

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-2xl p-4 shadow-sm flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <img src="${product.img}" alt="${product.name}" class="w-full h-40 object-cover rounded-xl mb-3">
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">${product.category}</span>
                        <h3 class="text-lg font-bold text-gray-900 mt-1">${product.name}</h3>
                    </div>
                    <div class="mt-4 flex items-center justify-between border-t border-gray-50 pt-3">
                        <span class="text-xl font-black text-gray-900">Rs. ${product.price}</span>
                        <button onclick="window.addToCart('${product.id}')" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition-all">
                            + Add
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.addToCart = function(id) {
            const item = products.find(p => p.id === id);
            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCart();
        };

        window.updateQty = function(id, delta) {
            const item = cart.find(c => c.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
            updateCart();
        };

        function updateCart() {
            const container = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            
            const rows = container.querySelectorAll('.cart-row');
            rows.forEach(r => r.remove());

            if (cart.length === 0) {
                emptyMsg.classList.remove('hidden');
                document.getElementById('cart-total').innerText = "Rs. 0";
                return;
            }

            emptyMsg.classList.add('hidden');
            let total = 0;

            cart.forEach(item => {
                total += (item.price * item.qty);
                const row = document.createElement('div');
                row.className = "cart-row bg-gray-50 rounded-xl p-3 flex justify-between items-center border border-gray-100";
                row.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-sm text-gray-900 truncate">${item.name}</h4>
                        <span class="text-xs text-gray-500">Rs. ${item.price}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="window.updateQty('${item.id}', -1)" class="w-6 h-6 bg-white border border-gray-200 rounded-lg text-xs font-bold">-</button>
                        <span class="font-bold text-sm">${item.qty}</span>
                        <button onclick="window.updateQty('${item.id}', 1)" class="w-6 h-6 bg-white border border-gray-200 rounded-lg text-xs font-bold">+</button>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById('cart-total').innerText = `Rs. ${total}`;
        }

        window.placeOrder = function() {
            if (cart.length === 0) return;
            alert("✅ Order Placed Successfully!");
            cart = [];
            updateCart();
        };

        document.getElementById('search-bar').addEventListener('input', (e) => {
            renderGrid(e.target.value);
        });
    </script>
</body>
</html>
